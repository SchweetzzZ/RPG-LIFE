services:
  mongodb:
    image: mongo:latest
    container_name: rpg-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: always

  redis:
    image: redis:alpine
    container_name: rpg-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rpg-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672" # Painel de gerenciamento do RabbitMQ (http://localhost:15672)
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: always

volumes:
  mongodb_data:
  redis_data:
  rabbitmq_data:
